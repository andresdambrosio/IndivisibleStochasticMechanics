name: Lean build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `--wfail` turns every warning into an error, including `declaration uses 'sorry'`.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"

  trusted-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every definition must be registered in TRUSTED.md; see CONTRIBUTING.md.
      - run: python3 scripts/check_trusted.py
