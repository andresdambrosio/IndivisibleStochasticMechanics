name: Book

on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          curl -sSfL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Install mdbook-katex
        run: cargo install mdbook-katex --version 0.10.0 --locked
      # English (default) at the site root, Spanish under `es/`. English first: each build
      # clears its own output directory.
      - name: Build book (English)
        run: mdbook build book/en
      - name: Build book (Spanish)
        run: mdbook build book/es
      - uses: actions/upload-pages-artifact@v4
        with:
          path: book/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
